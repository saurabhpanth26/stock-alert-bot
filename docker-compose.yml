services:
  stock-alert-bot:
    build: .
    container_name: stock-alert-bot
    restart: unless-stopped
    env_file: .env
    # Cap Docker logs at 3 x 10 MB; old logs rotate out automatically (no cron needed)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Named volume: Docker creates it owned by the container's `bot` user, so saving always works.
      # (A ./data bind mount is created as root on Linux servers and the bot can't write to it.)
      - bot-data:/app/data

volumes:
  bot-data:
